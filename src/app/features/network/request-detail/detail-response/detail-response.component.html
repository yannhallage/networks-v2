<div
  class="dr-wrap inspector-scrollbar min-h-0 min-w-0 flex-1 overflow-y-auto overflow-x-auto overscroll-contain px-1 py-2 [scrollbar-gutter:stable]"
>
  <div class="mb-2 flex items-center justify-end">
    <button
      type="button"
      class="cursor-pointer rounded border border-neutral-300 px-2 text-[11px] text-neutral-700 hover:bg-neutral-50 dark:border-neutral-600 dark:text-neutral-200 dark:hover:bg-neutral-800"
      (click)="toggleJsonColors()"
    >
      {{ useJsonColors() ? 'Colors' : 'No colors' }}
    </button>
  </div>
  @for (row of lineRows(); track row.num) {
  <div class="dr-line-row flex min-w-0 gap-3 hover:bg-neutral-50/80">
    <span
      class="w-8 shrink-0 select-none text-right text-[11px] tabular-nums text-neutral-400"
      >{{ row.num }}</span
    >
    <span class="min-w-0 whitespace-pre font-mono text-[12px]">
      @for (segment of row.segments; track $index) {
      <span [class]="tokenClass(segment.kind)">{{ segment.text }}</span>
      }
    </span>
  </div>
  }
</div>

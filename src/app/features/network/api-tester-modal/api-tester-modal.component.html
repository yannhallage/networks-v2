@if (open) {
<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/35 backdrop-blur-[1px]"
  (click)="close()"
>
  <section
    class="api-tester-sheet flex w-[min(2320px,100vw)] max-w-[1120px] min-w-[320px] flex-col overflow-hidden rounded-t-xl border shadow-2xl"
    [ngClass]="theme === 'dark' ? 'border-slate-700 bg-slate-950 text-slate-100' : 'border-neutral-300 bg-white text-neutral-800'"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-label="API Tester"
  >
    <header
      class="flex h-11 shrink-0 items-center gap-2 border-b px-3"
      [ngClass]="theme === 'dark' ? 'border-slate-700 bg-slate-900' : 'border-neutral-200 bg-neutral-50'"
    >
      <select
        class="h-7 rounded border px-2 text-[11px] font-semibold"
        [ngClass]="theme === 'dark' ? 'border-slate-600 bg-slate-900 text-slate-100' : 'border-neutral-300 bg-white text-neutral-800'"
        [value]="method()"
        (change)="setMethod($any($event.target).value)"
      >
        @for (httpMethod of methods; track httpMethod) {
        <option [value]="httpMethod">{{ httpMethod }}</option>
        }
      </select>

      <input
        type="text"
        placeholder="Enter URL or paste text"
        class="h-7 min-w-0 flex-1 rounded border px-3 text-[11px] outline-none"
        [ngClass]="theme === 'dark'
          ? 'border-slate-600 bg-slate-900 text-slate-100 placeholder:text-slate-400'
          : 'border-neutral-300 bg-white text-neutral-800 placeholder:text-neutral-400'"
      />

      <button
        type="button"
        class="h-7 rounded cursor-pointer bg-blue-600 px-4 text-[11px] font-semibold text-white hover:bg-blue-700"
      >
        Send
      </button>

      <button
        type="button"
        class="h-7 rounded cursor-pointer border px-2 text-[11px]"
        [ngClass]="theme === 'dark' ? 'border-slate-600 bg-slate-900 hover:bg-slate-800' : 'border-neutral-300 bg-white hover:bg-neutral-100'"
        (click)="close()"
      >
        Fermer
      </button>
    </header>

    <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
      <div class="min-h-0 flex-1 overflow-hidden border-b" [ngClass]="theme === 'dark' ? 'border-slate-700' : 'border-neutral-200'">
        <div
          class="flex h-10 shrink-0 items-center gap-1 border-b px-2"
          [ngClass]="theme === 'dark' ? 'border-slate-700 bg-slate-900' : 'border-neutral-200 bg-white'"
        >
          <span class="mr-2 text-[11px]" [ngClass]="theme === 'dark' ? 'text-slate-300' : 'text-neutral-600'">Docs</span>
          @for (tab of tabs; track tab.id) {
          <button
            type="button"
            class="rounded cursor-pointer px-2 py-1 text-[11px]"
            [ngClass]="activeTab() === tab.id
              ? (theme === 'dark' ? 'bg-blue-900/40 text-blue-200' : 'bg-blue-50 text-blue-700')
              : (theme === 'dark' ? 'text-slate-300 hover:bg-slate-800' : 'text-neutral-600 hover:bg-neutral-100')"
            (click)="setTab(tab.id)"
          >
            {{ tab.label }}
          </button>
          }
        </div>

        <div class="min-h-0 flex-1 overflow-auto p-3">
          @switch (activeTab()) { @case ('params') {
          <app-api-tester-params-item [theme]="theme" />
          } @case ('authorization') {
          <app-api-tester-authorization-item [theme]="theme" />
          } @case ('headers') {
          <app-api-tester-headers-item [theme]="theme" />
          } @case ('body') {
          <app-api-tester-body-item [theme]="theme" />
          } @case ('scripts') {
          <app-api-tester-scripts-item [theme]="theme" />
          } @case ('settings') {
          <app-api-tester-settings-item [theme]="theme" />
          } }
        </div>
      </div>

      <div class="min-h-[240px] max-h-[48%] shrink-0 overflow-hidden">
        <div
          class="flex h-10 items-center justify-between border-b px-3 text-[11px] font-semibold"
          [ngClass]="theme === 'dark' ? 'border-slate-700 bg-slate-900' : 'border-neutral-200 bg-white'"
        >
          <span>Response</span>
          <span class="font-normal" [ngClass]="theme === 'dark' ? 'text-slate-400' : 'text-neutral-500'">History</span>
        </div>
        <div class="h-[calc(100%-2.5rem)] overflow-auto p-3">
          <div
            class="flex h-full items-center justify-center rounded border text-[12px]"
            [ngClass]="theme === 'dark' ? 'border-slate-700 bg-slate-950 text-slate-400' : 'border-neutral-200 bg-neutral-50 text-neutral-500'"
          >
            Send request to get a response
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
}

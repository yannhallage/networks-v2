<div class="min-h-0 flex-1 overflow-auto p-2">
  <table mat-table [dataSource]="requests" class="w-full">
    <ng-container matColumnDef="method">
      <th mat-header-cell *matHeaderCellDef class="!font-semibold">METHOD</th>
      <td mat-cell *matCellDef="let r">{{ r.method }}</td>
    </ng-container>
    <ng-container matColumnDef="url">
      <th mat-header-cell *matHeaderCellDef class="!font-semibold">URL</th>
      <td mat-cell *matCellDef="let r">{{ r.url }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="!font-semibold">STATUS</th>
      <td mat-cell *matCellDef="let r">{{ r.status }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      class="cursor-pointer hover:bg-black/[0.04]"
      (click)="onRowClick(row)"
    ></tr>
  </table>
</div>
